<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<!-- 网站标题（浏览器标签栏显示），可自行修改 -->
<title>YRYR Collect · 周边图鉴</title>
<!-- 浏览器标签页小图标（favicon），与顶部 logo 同图 -->
<meta name="theme-color" content="#fdf3f6">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://raw.githubusercontent.com">
<link rel="icon" href="https://cdn.jsdelivr.net/gh/yukoriz/yryr-img@main/images/title.png" type="image/png">
<link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/yukoriz/yryr-img@main/images/title.png">
<style>
  :root{
    --bg:#fdf3f6;
    --card:#ffffff;
    --ink:#2b2226;
    --sub:#8e7e85;
    --line:#f0e3e8;
    --accent:#df7a9c;
    --accent-soft:#fbe9ef;
    --accent-deep:#b55879;
    --goods:#c46d8c;
    --goods-soft:#fdf0f4;
    --surface-tint:#fff9fb;
    --thumb-bg:#f7ecef;
    --input-bg:#ffffff;
    --modal-stage:#faf2f5;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:28px 20px 80px;}

  /* ===== 顶部标题与作者声明 ===== */
  header{margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .head-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .site-logo{height:46px;width:auto;display:block;border-radius:10px;object-fit:contain;}
  header .head-text{display:flex;flex-direction:column;}
  header h1{font-size:24px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .curator-badge{
    font-size:12.5px;font-weight:600;color:var(--accent-deep);
    background:var(--accent-soft);border:1px solid #f4cfd9;
    border-radius:999px;padding:2px 10px;letter-spacing:0;
  }
  header p{color:var(--sub);font-size:13px;margin-top:4px;}
  .site-notice{
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:10px;
    padding:9px 14px;
    font-size:13px;
    color:var(--ink);
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:4px;
  }
  .site-notice strong{color:var(--accent-deep);}
  .site-notice a{color:var(--accent-deep);text-decoration:underline;}
  .site-notice .qq-group{width:100%;font-size:13px;color:var(--ink);display:flex;align-items:center;flex-wrap:wrap;gap:6px;}
  .qq-copy{
    border:1px solid #f4cfd9;background:var(--accent-soft);color:var(--accent-deep);
    border-radius:8px;padding:2px 10px;font-size:13px;font-weight:600;letter-spacing:.5px;
    cursor:pointer;transition:background .15s,color .15s;
  }
  .qq-copy:hover{background:var(--accent);color:#fff;}
  .qq-copy.copied{background:var(--accent);color:#fff;border-color:var(--accent);}
  .qq-tip{font-size:12px;color:var(--sub);}

  /* ===== 主体双栏布局：左侧制品侧边栏 + 右侧主内容区 ===== */
  .main-layout{
    display:flex;
    align-items:flex-start;
    gap:20px;
  }

  /* ===== 左侧边栏：制品检索 + A-Z 快速定位 ===== */
  .goods-sidebar{
    width:248px;
    flex-shrink:0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    position:sticky;
    top:18px;
    max-height:calc(100vh - 36px);
    display:flex;
    flex-direction:column;
  }
  .sb-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .sb-title{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .sb-total{
    font-size:12px;
    color:var(--sub);
  }
  /* 第一项：全部制品 */
  .sb-all-btn{
    width:100%;
    text-align:left;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    border-radius:10px;
    padding:8px 12px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    transition:all .15s ease;
  }
  .sb-all-btn:hover{
    border-color:var(--goods);
    background:var(--goods-soft);
  }
  .sb-all-btn.active{
    background:var(--goods);
    border-color:var(--goods);
    color:#fff;
  }
  /* A-Z 字母快速定位条 */
  .az-bar{
    display:flex;
    flex-wrap:wrap;
    gap:3px;
    padding:6px;
    background:var(--surface-tint);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:10px;
  }
  .az-btn{
    width:22px;
    height:22px;
    border:none;
    border-radius:5px;
    background:transparent;
    font-size:11.5px;
    font-weight:600;
    color:var(--goods);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    transition:background .12s,color .12s;
  }
  .az-btn:hover:not(:disabled){
    background:var(--goods);
    color:#fff;
  }
  .az-btn.active{
    background:var(--goods);
    color:#fff;
  }
  .az-btn:disabled{
    color:#dfc8d0;
    cursor:default;
  }
  /* 制品滚动列表 */
  .sb-scroll{
    overflow-y:auto;
    flex:1;
    padding-right:2px;
  }
  .sb-scroll::-webkit-scrollbar{width:5px;}
  .sb-scroll::-webkit-scrollbar-thumb{background:#f0dce3;border-radius:99px;}
  .sb-group{margin-bottom:12px;}
  .sb-group:last-child{margin-bottom:2px;}
  .sb-letter-head{
    font-size:12px;
    font-weight:700;
    color:var(--goods);
    background:var(--goods-soft);
    padding:2px 8px;
    border-radius:6px;
    margin-bottom:5px;
    position:sticky;
    top:0;
    z-index:1;
  }
  .sb-items{
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .sb-item{
    width:100%;
    text-align:left;
    border:none;
    background:transparent;
    color:var(--ink);
    border-radius:8px;
    padding:6px 10px;
    font-size:13px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    transition:background .12s,color .12s;
  }
  .sb-item:hover{
    background:var(--goods-soft);
    color:var(--goods);
  }
  .sb-item.active{
    background:var(--goods);
    color:#fff;
    font-weight:600;
  }
  .sb-item .sb-name{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .sb-item .sb-num{
    font-size:11.5px;
    opacity:.75;
    flex-shrink:0;
  }

  /* ===== 右侧内容区 ===== */
  .content-col{
    flex:1;
    min-width:0;
  }

  /* ===== 工具栏：搜索 / 角色下拉 / 时间 / 排序 ===== */
  .toolbar{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
    margin-bottom:16px;
  }
  .toolbar .field{display:flex;align-items:center;gap:8px;}
  .toolbar label{font-size:13px;color:var(--sub);white-space:nowrap;}
  .toolbar input[type=search],.toolbar input[type=date],.toolbar select{
    border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:14px;
    background:var(--input-bg);color:var(--ink);outline:none;max-width:100%;
    height:40px;line-height:1.4;box-sizing:border-box;width:auto;
  }
  .toolbar .field-search{flex:1 1 100%;}
  .toolbar input[type=search]{min-width:0;flex:1;width:100%;}
  .toolbar input::placeholder{color:var(--sub);opacity:.85;}
  .toolbar input[type=search]::-webkit-search-decoration,
  .toolbar input[type=search]::-webkit-search-cancel-button{
    -webkit-appearance:none;appearance:none;display:none;
  }
  .toolbar select{cursor:pointer;min-width:130px;}
  .toolbar input:focus,.toolbar select:focus{border-color:var(--accent);}
  .toolbar .spacer{flex:1;}
  .count{font-size:13px;color:var(--sub);}

  /* ===== 活动卡片网格 ===== */
  .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(181,88,121,.08);}
  .card .thumb{width:100%;aspect-ratio:4/3;background:var(--thumb-bg);overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .card .thumb img{
    width:100%;height:100%;object-fit:cover;display:block;
    opacity:0;transition:opacity .25s ease;
  }
  .card .thumb img.loaded{opacity:1;}
  .card .noimg{color:#d2b8c2;font-size:13px;}
  .card .body{padding:14px 16px;}
  .card .title{font-size:15px;font-weight:600;line-height:1.4;margin-bottom:6px;}
  .card .date{font-size:13px;color:var(--sub);margin-bottom:8px;}
  .card .tags{display:flex;flex-wrap:wrap;gap:6px;}
  .card .tags span{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;}

  /* ===== 制品/角色视图：图片网格（选中制品或角色后出现） ===== */
  .goods-grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));}
  .g-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;
  }
  .g-card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(181,88,121,.08);}
  .g-card .thumb{width:100%;aspect-ratio:1/1;background:var(--thumb-bg);overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .g-card .thumb img{
    width:100%;height:100%;object-fit:cover;display:block;
    opacity:0;transition:opacity .25s ease;
  }
  .g-card .thumb img.loaded{opacity:1;}
  .g-card .body{padding:12px 14px;}
  .g-card .g-name{font-size:14px;font-weight:600;line-height:1.4;margin-bottom:4px;}
  .g-card .g-from{font-size:12.5px;color:var(--sub);margin-bottom:8px;line-height:1.4;}
  .g-card .g-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .g-card .g-tags span{font-size:12px;border-radius:6px;padding:2px 8px;}
  .g-card .g-tags .r{color:var(--accent);background:var(--accent-soft);}
  .g-card .g-tags .g{color:var(--goods);background:var(--goods-soft);}

  /* ===== 空状态友好提示 ===== */
  .empty{
    text-align:center;color:var(--sub);
    background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
    padding:48px 20px;font-size:14px;line-height:1.8;
  }
  .empty .empty-reset{
    margin-top:14px;border:1px solid var(--accent);background:var(--accent-soft);
    color:var(--accent-deep);border-radius:999px;padding:6px 18px;font-size:13px;cursor:pointer;
  }
  .empty .empty-reset:hover{background:var(--accent);color:#fff;}

  .view-hint{
    font-size:13px;color:var(--goods);background:var(--goods-soft);
    padding:8px 12px;border-radius:10px;margin:-4px 0 16px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .view-hint .clear-goods{
    border:none;background:var(--card);color:var(--goods);font-size:12px;
    padding:3px 10px;border-radius:999px;cursor:pointer;flex-shrink:0;
  }
  .view-hint .clear-goods:hover{background:var(--goods);color:#fff;}
  .load-more-wrap{text-align:center;margin-top:24px;}
  .load-more-btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 24px;font-size:13.5px;cursor:pointer;transition:border-color .15s,transform .15s;}
  .load-more-btn:hover{border-color:var(--accent);transform:translateY(-1px);}

  /* ===== 底部页脚署名 ===== */
  footer.site-footer{
    margin-top:44px;padding-top:18px;border-top:1px solid var(--line);
    text-align:center;font-size:13px;color:var(--sub);line-height:1.8;
  }
  footer.site-footer strong{color:var(--accent-deep);}
  footer.site-footer a{color:var(--accent-deep);text-decoration:underline;}

  /* ===== 详情弹窗（轮播） ===== */
  .modal-mask{position:fixed;inset:0;background:rgba(43,34,38,.52);display:none;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .modal-mask.open{display:flex;}
  .modal{
    background:var(--card);border-radius:16px;max-width:640px;width:100%;max-height:92vh;
    overflow-y:auto;position:relative;
  }
  .modal .m-stage{position:relative;background:var(--modal-stage);}
  .modal .m-img{width:100%;max-height:56vh;object-fit:contain;display:block;background:var(--modal-stage);}
  .modal .m-nav{
    position:absolute;top:50%;transform:translateY(-50%);
    width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(255,255,255,.85);font-size:20px;line-height:1;color:var(--ink);
  }
  .modal .m-nav.prev{left:12px;}
  .modal .m-nav.next{right:12px;}
  .modal .m-counter{position:absolute;bottom:12px;right:14px;background:rgba(43,34,38,.58);color:#fff;font-size:12.5px;border-radius:999px;padding:3px 10px;}
  .modal .m-body{padding:18px 24px 24px;}
  .modal .m-date{color:var(--sub);font-size:13px;margin-bottom:6px;}
  .modal .m-title{font-size:19px;font-weight:700;margin-bottom:8px;}
  /* 别名 / 常用简称 */
  .modal .m-aliases{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center;}
  .modal .m-aliases .alias-label{font-size:12.5px;color:var(--sub);}
  .modal .m-aliases span.alias{
    font-size:12px;color:var(--accent-deep);background:var(--accent-soft);
    border-radius:6px;padding:2px 8px;
  }
  .modal .m-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .modal .m-tags span{font-size:12px;border-radius:6px;padding:2px 8px;}
  .modal .m-tags .r{color:var(--accent);background:var(--accent-soft);}
  .modal .m-tags .g{color:var(--goods);background:var(--goods-soft);}
  .modal .m-photoname{font-size:14.5px;font-weight:600;margin-bottom:4px;}
  .modal .m-info{font-size:13px;color:var(--sub);margin-bottom:14px;white-space:pre-wrap;}
  .modal .m-desc{font-size:14.5px;white-space:pre-wrap;color:var(--ink);margin-bottom:16px;}
  /* 底部缩略图条 */
  .modal .m-thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;}
  .modal .m-thumbs img{
    width:74px;height:74px;object-fit:cover;border-radius:8px;cursor:pointer;
    border:2px solid transparent;flex-shrink:0;opacity:.7;
  }
  .modal .m-thumbs img.on{border-color:var(--accent);opacity:1;}
  .modal .m-open{display:inline-block;margin-top:10px;font-size:13px;color:var(--accent);text-decoration:none;}
  .modal .close{
    position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:50%;z-index:2;
    background:rgba(255,255,255,.9);border:none;font-size:18px;cursor:pointer;line-height:1;
  }
  /* 弹窗图片点击放大 / 拖拽平移 */
  .modal .m-stage{overflow:visible;}
  .modal .m-img{transition:transform .15s ease;transform-origin:center center;}
  .modal .m-img.dragging{transition:none;}

  /* ===== 平板适配 ===== */
  @media(max-width:860px){
    .main-layout{flex-direction:column;}
    .goods-sidebar{
      width:100%;
      position:static;
      max-height:none;
    }
    .sb-scroll{
      max-height:220px;
    }
    .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
    .goods-grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
    .wrap{padding:22px 16px 70px;}
  }
  /* ===== 手机适配 ===== */
  @media(max-width:560px){
    .toolbar{padding:12px;gap:8px;}
    .toolbar .field{flex:1 1 100%;}
    .toolbar input[type=search]{min-width:0;width:100%;}
    .toolbar input[type=date],.toolbar select{flex:1;min-width:0;}
    .count{flex:1 1 100%;}
    header h1{font-size:20px;}
    .site-logo{height:34px;}
    .grid{grid-template-columns:repeat(2,1fr);gap:12px;}
    .goods-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
    .card .body{padding:10px 12px;}
    .card .title{font-size:14px;}
    .g-card .body{padding:10px 12px;}
    .modal{border-radius:14px;}
    .modal .m-body{padding:14px 16px 18px;}
    .modal .m-title{font-size:17px;}
    .modal .m-nav{width:32px;height:32px;font-size:18px;}
    .modal .m-thumbs img{width:60px;height:60px;}
  }
  @media(max-width:380px){
    .grid,.goods-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <noscript>
    <div style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px;font-size:14px;">
      <strong>YRYR Collect · 周边图鉴</strong>：本站的图鉴检索与筛选需要启用 JavaScript，请在浏览器设置中开启后刷新页面。
    </div>
  </noscript>
  <header>
    <div class="head-left">
      <!-- 网站 LOGO 图片，路径按需替换 -->
      <img class="site-logo" referrerpolicy="no-referrer" src="https://cdn.jsdelivr.net/gh/yukoriz/yryr-img@main/images/title.png" onerror="fallbackImg(this)" alt="YRYR Collect 标识">
      <div class="head-text">
        <!-- 网站大标题，可自行修改 -->
        <h1>YRYR Collect · 周边图鉴 </h1>
        <p>点活动卡片看整套图；左侧边栏按字母选制品，顶部工具栏可直接搜角色/制品或筛选时间</p>
      </div>
    </div>
    <div class="site-notice">
      <span>图鉴由<strong>楚恬</strong>收集整理分类，欢迎提出问题/建议,可以发邮件至 <a href="mailto:1722068978@qq.com">1722068978@qq.com</a>，本网站仅用于同好分享交流。图源网络,侵删。</span>
      <span class="qq-group">摇曳百合周边交易禁水QQ群：<button type="button" class="qq-copy" data-qq="1035830815">1035830815</button><span class="qq-tip">点击复制群号</span></span>
    </div>
  </header>

  <div class="main-layout">
    <!-- ===== 左侧边栏：全部制品 + A-Z 字母快速定位 ===== -->
    <aside class="goods-sidebar" aria-label="制品分类侧边栏">
      <div class="sb-header">
        <span class="sb-title">制品索引</span>
        <span class="sb-total" id="sbTotal"></span>
      </div>
      <button type="button" class="sb-all-btn active" id="sbAllBtn">
        <span>全部制品</span>
        <span id="sbAllCount"></span>
      </button>
      <div class="az-bar" id="azBar" aria-label="首字母快速定位"></div>
      <div class="sb-scroll" id="sbScroll"></div>
    </aside>

    <!-- ===== 右侧主内容区 ===== -->
    <div class="content-col">
      <!-- ===== 工具栏：搜索 + 角色下拉 + 时间 + 排序 ===== -->
      <div class="toolbar">
        <div class="field field-search">
          <label>搜索</label>
          <input type="search" id="kw" placeholder="名称 / 别名 / 角色 / 制品 / 简介">
        </div>
        <div class="field">
          <label>角色</label>
          <select id="roleSel"><option value="">全部角色</option></select>
        </div>
        <div class="field">
          <label>从</label><input type="date" id="from">
          <label>到</label><input type="date" id="to">
        </div>
        <div class="field">
          <label>排序</label>
          <select id="sort">

<!-- ===== 详情弹窗（轮播） ===== -->
<div class="modal-mask" id="mask">
  <div class="modal">
    <button class="close" id="closeBtn">×</button>
    <div class="m-stage">
      <img class="m-img" id="mImg" referrerpolicy="no-referrer" decoding="async" onerror="fallbackImg(this)" alt="">

      <div class="m-desc" id="mDesc"></div>

      <a class="m-open" id="mOpen" href="#" target="_blank" rel="noopener">查看原图 ↗</a>

<script>
// 图片图床前缀：数据区写的相对路径（images/...）会自动拼到这个 jsDelivr 地址
// 若以后换仓库 / 分支，只改这一行即可
const IMG_BASE = "https://cdn.jsdelivr.net/gh/yukoriz/yryr-img@main/";
// 这些固定标记不进入制品侧边栏、不参与筛选
const HIDDEN_GOODS = ["cover", "sum"];
// 本地筛选状态记忆 key
const FILTER_STORAGE_KEY = "yryr_collect_filter_state_v1";

// 角色排序优先级：娱乐部四人组（主角） -> 学生会四人组 -> 大室家姐妹及同学 -> 亲属/其他角色 -> 组合/全员标签
const ROLE_ORDER = [
  // 娱乐部（主角组）
  "赤座灯里", "岁纳京子", "船见结衣", "吉川千夏",
  // 学生会（主要配角）
  "杉浦绫乃", "池田千岁", "大室樱子", "古谷向日葵",
  // 大室家 / 其他七森中及关联角色
  "大室抚子", "大室花子", "池田千鹤",
  "园川惠", "三轮蓝", "八重野美穗",
  "小川心", "相马未来", "高崎美咲",
  "西垣奈奈", "松本理世",
  "古谷枫", "船见真理", "赤座茜", "吉川友子",
  // 组合 / 整体标签
  "娱乐部", "学生会", "大室家", "高中组", "小学组", "全员", "水母", "其他"
];

// 角色别名对照表：key=标准本名，value=别称（简称/罗马音/外号）。在搜索框输入别称即可命中本体角色
// 注意：data.json 里 photos[].roles 只写标准本名，所有别称统一维护在这一张表里
const ROLE_ALIAS_MAP = {
  "赤座灯里":["灯里", "阿卡林", "akarin"],
  "岁纳京子":["京子", "kyoko"],
  "船见结衣":["结衣", "yui"],
  "吉川千夏":["千夏", "chinatsu"],
  "杉浦绫乃":["绫乃", "ayano"],
  "池田千岁":["千岁", "chiito"],
  "大室樱子":["樱子", "sakurako"],
  "古谷向日葵":["向日葵", "himawari"],
  "大室抚子":["抚子", "nadeshiko"],
  "大室花子":["花子", "hanako"],
  "池田千鹤":["千鹤"],
  "松本理世":["会长"],
  "西垣奈奈":["老师"],
  "赤座茜":["灯姐","灯里姐姐","姐姐"],
  "吉川友子":["千夏姐姐","姐姐"],
  "古谷枫":["向日葵妹妹"],
  "船见真理":["结衣妹妹"],
};

// 输入搜索关键词，返回命中的标准角色名数组（本名或任意别称包含该词即命中）
function resolveRoleAliases(keyword){
  const kw = String(keyword || "").trim().toLowerCase();
  if(!kw) return [];
  const result = [];
  for(const [realName, aliasList] of Object.entries(ROLE_ALIAS_MAP)){
    const aliases = [realName, ...(aliasList || [])].map(a => String(a).toLowerCase());
    if(aliases.some(a => a.includes(kw))){
      result.push(realName);
    }
  }
  return result;
}

let ACTIVITIES = []; // 会从 data.json 远程加载

const grid = document.getElementById('grid');
const goodsGrid = document.getElementById('goodsGrid');
const emptyEl = document.getElementById('empty');
const hintEl = document.getElementById('hint');
const hintTextEl = document.getElementById('hintText');
const clearGoodsBtn = document.getElementById('clearGoodsBtn');
const emptyResetBtn = document.getElementById('emptyResetBtn');
const kw = document.getElementById('kw');
const from = document.getElementById('from');
const to = document.getElementById('to');
const sortSel = document.getElementById('sort');
const countEl = document.getElementById('count');
const roleSel = document.getElementById('roleSel');

// 侧边栏相关 DOM
const sbTotal = document.getElementById('sbTotal');
const sbAllBtn = document.getElementById('sbAllBtn');
const sbAllCount = document.getElementById('sbAllCount');
const azBar = document.getElementById('azBar');
const sbScroll = document.getElementById('sbScroll');

let activeRole = "";   // 选中的角色 tag，空=全部
let activeGoods = "";  // 选中的制品 tag，空=全部

/* ---------- 本地状态记忆（localStorage） ---------- */
function saveFilterState(){
  try{
    const state = {
      activeRole,
      activeGoods,
      from: from.value || "",
      to: to.value || "",
      kw: kw.value || "",
      sort: sortSel.value || "desc"
    };
    localStorage.setItem(FILTER_STORAGE_KEY, JSON.stringify(state));
  }catch(e){}
}

function loadFilterState(){
  try{
    const raw = localStorage.getItem(FILTER_STORAGE_KEY);
    if(!raw) return;
    const state = JSON.parse(raw);
    if(!state || typeof state !== "object") return;
    if(typeof state.activeRole === "string") activeRole = state.activeRole;
    if(typeof state.activeGoods === "string") activeGoods = state.activeGoods;
    if(typeof state.from === "string") from.value = state.from;
    if(typeof state.to === "string") to.value = state.to;
    if(typeof state.kw === "string") kw.value = state.kw;
    if(state.sort === "asc" || state.sort === "desc") sortSel.value = state.sort;
  }catch(e){}
}

function resetAllFilters(){
  activeRole = "";
  activeGoods = "";
  roleSel.value = "";
  kw.value = "";
  from.value = "";
  to.value = "";
  sortSel.value = "desc";
  syncSidebarActive();
  saveFilterState();
  render(true);
}

// 启动时先恢复输入框状态，数据加载后再同步下拉与侧边栏高亮
loadFilterState();

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// 判断是不是合法图片链接（排除“这里填…”这类占位文字，防止裂图）
function isValidSrc(src){
  if(!src) return false;
  return /^https?:\/\//i.test(src) || /\.(webp|jpg|jpeg|png|gif|avif)/i.test(src);
}
// 相对路径自动拼上图床前缀；已是 http 外链或占位文本则原样返回
function resolveSrc(src){
  if(!src) return "";
  if(/^https?:\/\//i.test(src)) return src;
  if(src.includes("这里填")) return src;
  if(!/\.(webp|jpg|jpeg|png|gif|avif)/i.test(src)) return src;
  return IMG_BASE + src.replace(/^\//, "");
}
// jsDelivr 加载失败时自动回退到 raw.githubusercontent.com
function fallbackImg(img){
  if(!img.dataset.retried && img.src.includes("cdn.jsdelivr.net/gh/")){
    img.dataset.retried = "1";
    img.src = img.src.replace(
      /^https:\/\/cdn\.jsdelivr\.net\/gh\/([^/]+)\/([^@]+)@([^/]+)\//,
      "https://raw.githubusercontent.com/$1/$2/$3/"
    );
    return;
  }
  img.classList.add("loaded");
}
// 兼容旧数据并缓存标准化结果，避免筛选/渲染时重复解析
const photoNormCache = new WeakMap();
function normPhoto(p){
  if(p && typeof p === 'object' && photoNormCache.has(p)){
    return photoNormCache.get(p);
  }
  let res;
  if(typeof p === 'string'){
    res = { src:resolveSrc(p), roles:[], goods:[], name:"", info:"" };
  } else {
    let roles = Array.isArray(p.roles) ? p.roles : (p.roles ? [p.roles] : []);
    let goods = Array.isArray(p.goods) ? p.goods : (p.goods ? [p.goods] : []);
    if(!goods.length && p.tag){
      goods = Array.isArray(p.tag) ? p.tag : [p.tag];
    }
    res = { src:resolveSrc(p.src||""), roles, goods, name:p.name||"", info:p.info||p.size||"" };
    if(p && typeof p === 'object') photoNormCache.set(p, res);
  }
  return res;
}

/* ---------- 角色按主角到配角排序 ---------- */
function sortRolesList(roleSet){
  const orderMap = new Map();
  ROLE_ORDER.forEach((name, idx) => orderMap.set(name, idx));
  return Array.from(roleSet).sort((a, b) => {
    const ia = orderMap.has(a) ? orderMap.get(a) : 9999;
    const ib = orderMap.has(b) ? orderMap.get(b) : 9999;
    if(ia !== ib) return ia - ib;
    return a.localeCompare(b, 'zh-Hans-CN');
  });
}

/* ---------- 严格按图片自身 roles tag 匹配（不自动展开组内成员） ---------- */
function photoMatchesRole(photoNorm, role){
  if(!role) return true;
  return (photoNorm.roles || []).includes(role);
}

/* ---------- 判断单张图片是否匹配搜索关键词（支持标题/别名/简介/图名/角色tag/制品tag） ---------- */
function photoMatchesKeyword(activity, photoNorm, q){
  if(!q) return true;
  const visibleGoods = (photoNorm.goods || []).filter(g => g && !HIDDEN_GOODS.includes(g));
  // 关键词命中角色别称时，换算成本体角色再判断
  const matchedRoles = resolveRoleAliases(q);
  if(matchedRoles.length){
    if((photoNorm.roles || []).some(r => matchedRoles.includes(r))) return true;
  }
  const searchText = [
    activity.title || '',
    ...(activity.aliases || []),
    activity.desc || '',
    photoNorm.name || '',
    photoNorm.info || '',
    ...(photoNorm.roles || []),
    ...visibleGoods
  ].join(' ').toLowerCase();
  return searchText.includes(q);
}

/* ---------- 汉字/英文首字母提取（用于制品 A-Z 索引） ---------- */
const PINYIN_BOUNDARIES = [
  ['A', '阿'], ['B', '芭'], ['C', '擦'], ['D', '搭'], ['E', '蛾'],
  ['F', '发'], ['G', '噶'], ['H', '哈'], ['J', '击'], ['K', '喀'],
  ['L', '垃'], ['M', '妈'], ['N', '拿'], ['O', '哦'], ['P', '啪'],
  ['Q', '期'], ['R', '然'], ['S', '撒'], ['T', '塌'], ['W', '挖'],
  ['X', '昔'], ['Y', '压'], ['Z', '匝']
];
const FIRST_LETTER_OVERRIDE = {
  '吧': 'B', '徽': 'H', '流': 'L', '明': 'M', '相': 'X',
  '亚': 'Y', '挂': 'G', '帆': 'F', '橡': 'X', '贴': 'T',
  '垫': 'D', '拍': 'P', '色': 'S', '立': 'L', '小': 'X',
  '名': 'M', '方': 'F', '纪': 'J', '速': 'S', '印': 'Y',
  '透': 'T', '法': 'F', '复': 'F', '特': 'T', '马': 'M'
};

function getInitialLetter(str){
  const s = String(str || '').trim();
  if(!s) return '#';
  const ch = s[0];
  if(/[a-zA-Z]/.test(ch)) return ch.toUpperCase();
  if(FIRST_LETTER_OVERRIDE[ch]) return FIRST_LETTER_OVERRIDE[ch];
  if(/[\u4e00-\u9fa5]/.test(ch)){
    let letter = '#';
    for(let i = 0; i < PINYIN_BOUNDARIES.length; i++){
      const [letChar, boundChar] = PINYIN_BOUNDARIES[i];
      if(ch.localeCompare(boundChar, 'zh-Hans-CN') >= 0){
        letter = letChar;
      } else {
        break;
      }
    }
    return letter;
  }
  return '#';
}

/* ---------- 选项收集：遍历所有图片 ---------- */
function collectOptions(){
  const roles = new Set();
  const goodsCountMap = new Map();
  ACTIVITIES.forEach(a=>{
    (a.photos||[]).forEach(p=>{
      const n = normPhoto(p);
      n.roles.forEach(r => { if(r) roles.add(r); });
      n.goods.forEach(g => {
        if(g && !HIDDEN_GOODS.includes(g)){
          goodsCountMap.set(g, (goodsCountMap.get(g) || 0) + 1);
        }
      });
    });
  });
  return { roles: sortRolesList(roles), goodsCountMap };
}

/* ---------- 构建角色下拉 + 左侧制品侧边栏 ---------- */
function buildControls(){
  const { roles, goodsCountMap } = collectOptions();

  // 若本地记忆的角色/制品在最新 data.json 中已不存在，自动清理避免卡死空状态
  if(activeRole && !roles.includes(activeRole)) activeRole = "";
  if(activeGoods && !goodsCountMap.has(activeGoods)) activeGoods = "";

  roleSel.innerHTML = '<option value="">全部角色</option>';
  roles.forEach(r=>{
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    if(activeRole === r) opt.selected = true;
    roleSel.appendChild(opt);
  });

  const goodsNames = Array.from(goodsCountMap.keys());
  sbTotal.textContent = `${goodsNames.length} 类`;
  sbAllCount.textContent = '';

  const groups = new Map();
  goodsNames.forEach(g => {
    const letter = getInitialLetter(g);
    if(!groups.has(letter)) groups.set(letter, []);
    groups.get(letter).push(g);
  });
  groups.forEach(arr => arr.sort((a, b) => a.localeCompare(b, 'zh-Hans-CN')));

  const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  if(groups.has('#')) ALPHABET.push('#');

  azBar.innerHTML = '';
  ALPHABET.forEach(letter => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'az-btn';
    btn.textContent = letter;
    btn.dataset.letter = letter;
    if(!groups.has(letter)){
      btn.disabled = true;
      btn.title = `暂无 ${letter} 开头制品`;
    } else {
      btn.title = `定位到 ${letter}`;
      btn.addEventListener('click', () => {
        azBar.querySelectorAll('.az-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const target = document.getElementById(`sb-group-${letter}`);
        if(target){
          const topOffset = target.offsetTop - sbScroll.offsetTop - 4;
          sbScroll.scrollTo({ top: Math.max(0, topOffset), behavior: 'smooth' });
        }
      });
    }
    azBar.appendChild(btn);
  });

  sbScroll.innerHTML = '';
  ALPHABET.forEach(letter => {
    if(!groups.has(letter)) return;
    const grpDiv = document.createElement('div');
    grpDiv.className = 'sb-group';
    grpDiv.id = `sb-group-${letter}`;

    const head = document.createElement('div');
    head.className = 'sb-letter-head';
    head.textContent = letter;
    grpDiv.appendChild(head);

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'sb-items';

    groups.get(letter).forEach(g => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'sb-item' + (activeGoods === g ? ' active' : '');
      btn.dataset.goods = g;
      btn.title = g;
      btn.innerHTML = `<span class="sb-name">${escapeHtml(g)}</span><span class="sb-num">${goodsCountMap.get(g)}</span>`;
      btn.addEventListener('click', () => selectGoods(g));
      itemsWrap.appendChild(btn);
    });

    grpDiv.appendChild(itemsWrap);
    sbScroll.appendChild(grpDiv);
  });

  syncSidebarActive();
}

function syncSidebarActive(){
  sbAllBtn.classList.toggle('active', !activeGoods);
  sbScroll.querySelectorAll('.sb-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.goods === activeGoods);
  });
}

function selectGoods(goodsName){
  activeGoods = goodsName || "";
  syncSidebarActive();
  saveFilterState();
  render(true);
}

sbAllBtn.addEventListener('click', () => selectGoods(""));
clearGoodsBtn.addEventListener('click', () => {
  if(activeGoods){
    activeGoods = "";
    syncSidebarActive();
  }
  if(activeRole){
    activeRole = "";
    roleSel.value = "";
  }
  saveFilterState();
  render(true);
});
emptyResetBtn.addEventListener('click', resetAllFilters);

/* ---------- 活动列表过滤（时间 / 关键词 / 角色 / 制品） ---------- */
function filteredActivities(){
  let list = ACTIVITIES.slice();
  const q = kw.value.trim().toLowerCase();

  if(activeRole){
    list = list.filter(a =>
      (a.photos||[]).some(p => photoMatchesRole(normPhoto(p), activeRole))
    );
  }

  if(q){
    list = list.filter(a => {
      const photos = a.photos || [];
      if(photos.length){
        return photos.some(p => photoMatchesKeyword(a, normPhoto(p), q));
      }
      const fallbackText = [a.title, ...(a.aliases||[]), a.desc||''].join(' ').toLowerCase();
      return fallbackText.includes(q);
    });
  }

  const normDate = d => String(d || '').slice(0, 10);
  if(from.value) list = list.filter(a => normDate(a.date) >= from.value);
  if(to.value) list = list.filter(a => normDate(a.date) <= to.value);
  list.sort((a,b)=>{
    const da = normDate(a.date), db = normDate(b.date);
    return sortSel.value==='desc' ? db.localeCompare(da) : da.localeCompare(db);
  });
  return list;
}
function firstPhotoSrc(a){
  const p = (a.photos||[]).map(normPhoto).find(x=>isValidSrc(x.src));
  return p ? p.src : "";
}
function getActivityRoles(a){
  const set = new Set();
  (a.photos||[]).forEach(p=>normPhoto(p).roles.forEach(r=>set.add(r)));
  return sortRolesList(set);
}
// 收集符合当前“角色 tag / 制品 tag / 搜索词”条件的图片列表
function collectMatchedPhotos(list){
  const out = [];
  const q = kw.value.trim().toLowerCase();
  list.forEach(a=>{
    (a.photos||[]).forEach((p,i)=>{
      const n = normPhoto(p);
      if(!isValidSrc(n.src)) return;
      if(activeGoods && !n.goods.includes(activeGoods)) return;
      if(activeRole && !photoMatchesRole(n, activeRole)) return;
      if(q && !photoMatchesKeyword(a, n, q)) return;
      out.push({ activity:a, photo:n, index:i });
    });
  });
  return out;
}

/* ---------- 主渲染（分批加载避免首屏并发拥堵） ---------- */
const BATCH_SIZE = 24;
let visibleLimit = BATCH_SIZE;
const loadMoreWrap = document.getElementById('loadMoreWrap');
const loadMoreBtn = document.getElementById('loadMoreBtn');

function render(resetPage = true){
  if(resetPage) visibleLimit = BATCH_SIZE;
  const list = filteredActivities();
  const q = kw.value.trim();
  const isPhotoGridMode = Boolean(activeGoods || activeRole || q);

  // 当选中“角色 / 制品 / 搜索关键词”时，按单张图片维度展示匹配周边
  if(isPhotoGridMode){
    grid.style.display = 'none';
    goodsGrid.style.display = 'grid';
    const matchedPhotos = collectMatchedPhotos(list);
    const parts = [];
    if(activeRole) parts.push(`角色「${activeRole}」`);
    if(activeGoods) parts.push(`制品「${activeGoods}」`);
    if(q) parts.push(`搜索「${q}」`);

    const hasTagHint = Boolean(activeGoods || activeRole);
    hintEl.style.display = hasTagHint ? 'flex' : 'none';
    if(hasTagHint){
      hintTextEl.textContent = `图片筛选 · ${parts.join('｜')}：共 ${matchedPhotos.length} 张（涉及 ${list.length} 场活动）`;
      clearGoodsBtn.textContent = (activeGoods && !activeRole) ? '返回全部制品' : '重置标签筛选';
    }
    countEl.textContent = `共 ${matchedPhotos.length} 张`;
    emptyEl.style.display = matchedPhotos.length ? 'none' : 'block';
    goodsGrid.innerHTML = '';

    const shown = matchedPhotos.slice(0, visibleLimit);
    shown.forEach((item, idx)=>{
      const card = document.createElement('div');
      card.className = 'g-card';
      const sortedItemRoles = sortRolesList(new Set(item.photo.roles));
      const roleHtml = sortedItemRoles.map(t=>`<span class="r">${escapeHtml(t)}</span>`).join('');
      const goodsHtml = item.photo.goods.filter(g=>!HIDDEN_GOODS.includes(g)).map(t=>`<span class="g">${escapeHtml(t)}</span>`).join('');
      const nameHtml = item.photo.name
        ? `<div class="g-name">${escapeHtml(item.photo.name)}</div>` : '';
      const loadAttr = idx < 6 ? 'loading="eager" fetchpriority="high"' : 'loading="lazy"';
      card.innerHTML = `
        <div class="thumb"><img referrerpolicy="no-referrer" src="${escapeHtml(item.photo.src)}" ${loadAttr} decoding="async" onload="this.classList.add('loaded')" onerror="fallbackImg(this)" alt="${escapeHtml(item.activity.title)}"></div>
        <div class="body">
          ${nameHtml}
          <div class="g-from">${escapeHtml(item.activity.title)} · ${escapeHtml(item.activity.date)}</div>
          <div class="g-tags">${roleHtml}${goodsHtml}</div>
        </div>`;
      card.addEventListener('click', ()=>openLightbox(item.activity, item.index));
      goodsGrid.appendChild(card);
    });

    if(matchedPhotos.length > visibleLimit){
      loadMoreWrap.style.display = 'block';
      loadMoreBtn.textContent = `加载更多（剩余 ${matchedPhotos.length - visibleLimit} 张）`;
    } else {
      loadMoreWrap.style.display = 'none';
    }
    return;
  }

  // 默认（未选角色、未选制品、无搜索词）：活动卡片视图
  goodsGrid.style.display = 'none';
  grid.style.display = 'grid';
  hintEl.style.display = 'none';
  countEl.textContent = `共 ${list.length} 场活动`;
  emptyEl.style.display = list.length ? 'none' : 'block';
  grid.innerHTML = '';

  const shownList = list.slice(0, visibleLimit);
  shownList.forEach((a, idx)=>{
    const card = document.createElement('div');
    card.className = 'card';
    const rawCover = a.cover ? resolveSrc(a.cover) : "";
    const src = isValidSrc(rawCover) ? rawCover : firstPhotoSrc(a);
    const loadAttr = idx < 6 ? 'loading="eager" fetchpriority="high"' : 'loading="lazy"';
    const thumb = src
      ? `<div class="thumb"><img referrerpolicy="no-referrer" src="${escapeHtml(src)}" ${loadAttr} decoding="async" onload="this.classList.add('loaded')" onerror="fallbackImg(this)" alt="${escapeHtml(a.title)}"></div>`
      : `<div class="thumb"><span class="noimg">暂无封面</span></div>`;
    const roleHtml = getActivityRoles(a).map(t=>`<span>${escapeHtml(t)}</span>`).join('');
    card.innerHTML = `
      ${thumb}
      <div class="body">
        <div class="title">${escapeHtml(a.title)}</div>
        <div class="date">${escapeHtml(a.date)}</div>
        <div class="tags">${roleHtml}</div>
      </div>`;
    card.addEventListener('click', ()=>openLightbox(a, 0));
    grid.appendChild(card);
  });

  if(list.length > visibleLimit){
    loadMoreWrap.style.display = 'block';
    loadMoreBtn.textContent = `加载更多（剩余 ${list.length - visibleLimit} 场）`;
  } else {
    loadMoreWrap.style.display = 'none';
  }
}

loadMoreBtn.addEventListener('click', ()=>{
  visibleLimit += BATCH_SIZE;
  render(false);
});

/* ---------- 弹窗轮播 ---------- */
const mask = document.getElementById('mask');
let modalActivity = null;
let modalPhotos = [];
let modalIdx = 0;

function openLightbox(activity, idx){
  modalActivity = activity;
  modalPhotos = (activity.photos||[]).map(normPhoto).filter(p=>isValidSrc(p.src));
  modalIdx = Math.min(idx, modalPhotos.length-1);
  if(modalIdx < 0) modalIdx = 0;
  renderModal();
  mask.classList.add('open');
}

function renderModal(){
  const a = modalActivity;
  document.getElementById('mTitle').textContent = a.title;
  const mImg = document.getElementById('mImg');
  const aliasBox = document.getElementById('mAliases');
  const aliases = a.aliases||[];
  if(aliases.length){
    aliasBox.style.display = 'flex';
    aliasBox.innerHTML = '<span class="alias-label">常用简称：</span>' +
      aliases.map(x=>`<span class="alias">${escapeHtml(x)}</span>`).join('');
  } else {
    aliasBox.style.display = 'none';
    aliasBox.innerHTML = '';
  }
  if(!modalPhotos.length){
    mImg.style.display = 'none';
    document.getElementById('mCounter').textContent = '0 / 0';
    document.getElementById('mTags').innerHTML = '';
    document.getElementById('mPhotoName').textContent = '';
    document.getElementById('mInfo').textContent = '';
    document.getElementById('mOpen').href = '#';
    document.getElementById('mThumbs').innerHTML = '';
    return;
  }
  mImg.style.display = 'block';
  const p = modalPhotos[modalIdx];
  document.getElementById('mDate').textContent = a.date;
  document.getElementById('mDesc').textContent = a.desc || '（暂无详情）';
  const sortedModalRoles = sortRolesList(new Set(p.roles));
  const roleHtml = sortedModalRoles.map(t=>`<span class="r">${escapeHtml(t)}</span>`).join('');
  const goodsHtml = p.goods.filter(g=>!HIDDEN_GOODS.includes(g)).map(t=>`<span class="g">${escapeHtml(t)}</span>`).join('');
  document.getElementById('mTags').innerHTML = roleHtml + goodsHtml;
  const nameBox = document.getElementById('mPhotoName');
  nameBox.textContent = p.name || '';
  nameBox.style.display = p.name ? 'block' : 'none';
  const infoBox = document.getElementById('mInfo');
  infoBox.textContent = p.info ? `详细信息：${p.info}` : '';
  infoBox.style.display = p.info ? 'block' : 'none';
  document.getElementById('mImg').src = p.src;
  resetZoom();
  document.getElementById('mCounter').textContent = `${modalIdx+1} / ${modalPhotos.length}`;
  document.getElementById('mOpen').href = p.src;
  if(modalPhotos.length > 1){
    const nextIdx = (modalIdx + 1) % modalPhotos.length;
    const prevIdx = (modalIdx - 1 + modalPhotos.length) % modalPhotos.length;
    [nextIdx, prevIdx].forEach(i=>{
      const pre = new Image();
      pre.referrerPolicy = "no-referrer";
      pre.src = modalPhotos[i].src;
    });
  }
  const thumbs = document.getElementById('mThumbs');
  thumbs.innerHTML = '';
  modalPhotos.forEach((tp, i)=>{
    const t = document.createElement('img');
    t.referrerPolicy = "no-referrer";
    t.decoding = "async";
    t.src = tp.src; t.loading='lazy'; t.alt = a.title; t.onerror = function(){ fallbackImg(this); };
    if(i===modalIdx) t.classList.add('on');
    t.onclick = ()=>{ modalIdx = i; renderModal(); };
    thumbs.appendChild(t);
  });
}

function step(dir){
  if(!modalPhotos.length) return;
  modalIdx = (modalIdx + dir + modalPhotos.length) % modalPhotos.length;
  renderModal();
}
document.getElementById('mPrev').addEventListener('click', ()=>step(-1));
document.getElementById('mNext').addEventListener('click', ()=>step(1));
document.getElementById('closeBtn').addEventListener('click', ()=>mask.classList.remove('open'));
mask.addEventListener('click', e=>{ if(e.target===mask) mask.classList.remove('open'); });
document.addEventListener('keydown', e=>{
  if(!mask.classList.contains('open')) return;
  if(e.key==='Escape') mask.classList.remove('open');
  if(e.key==='ArrowLeft') step(-1);
  if(e.key==='ArrowRight') step(1);
});

/* ---------- 弹窗图片：点击放大 / 拖拽平移 / 滚轮缩放 ---------- */
const mImgZoom = document.getElementById('mImg');
const zoomState = { scale:1, x:0, y:0, dragging:false, moved:false, startX:0, startY:0, baseX:0, baseY:0 };
function applyZoom(){
  mImgZoom.style.transform = `translate(${zoomState.x}px, ${zoomState.y}px) scale(${zoomState.scale})`;
  mImgZoom.style.cursor = zoomState.scale > 1 ? 'grab' : 'zoom-in';
}
function resetZoom(){
  zoomState.scale = 1; zoomState.x = 0; zoomState.y = 0;
  applyZoom();
}
mImgZoom.addEventListener('click', ()=>{
  if(zoomState.moved){ zoomState.moved = false; return; }
  if(zoomState.scale > 1){ resetZoom(); }
  else { zoomState.scale = 2.5; zoomState.x = 0; zoomState.y = 0; applyZoom(); }
});
mImgZoom.addEventListener('mousedown', e=>{
  if(zoomState.scale <= 1) return;
  zoomState.dragging = true;
  zoomState.moved = false;
  zoomState.startX = e.clientX; zoomState.startY = e.clientY;
  zoomState.baseX = zoomState.x; zoomState.baseY = zoomState.y;
  mImgZoom.classList.add('dragging');
  mImgZoom.style.cursor = 'grabbing';
  e.preventDefault();
});
window.addEventListener('mousemove', e=>{
  if(!zoomState.dragging) return;
  const dx = e.clientX - zoomState.startX;
  const dy = e.clientY - zoomState.startY;
  if(Math.abs(dx) > 3 || Math.abs(dy) > 3) zoomState.moved = true;
  zoomState.x = zoomState.baseX + dx;
  zoomState.y = zoomState.baseY + dy;
  applyZoom();
});
window.addEventListener('mouseup', ()=>{
  if(!zoomState.dragging) return;
  zoomState.dragging = false;
  mImgZoom.classList.remove('dragging');
  if(zoomState.scale > 1) mImgZoom.style.cursor = 'grab';
});
mImgZoom.addEventListener('wheel', e=>{
  if(zoomState.scale <= 1) return;
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.15 : 0.87;
  zoomState.scale = Math.min(4, Math.max(1.2, zoomState.scale * factor));
  applyZoom();
}, { passive:false });

/* ===== 加载外部 data.json 数据 ===== */
async function loadData(){
  try{
    const res = await fetch('./data.json');
    if(!res.ok) throw new Error("load json fail");
    ACTIVITIES = await res.json();
    buildControls();
    render(true);
  }catch(err){
    console.error("数据加载失败：",err);
    emptyEl.innerHTML = '<div>数据文件 data.json 加载失败，请刷新页面重试。</div>';
    emptyEl.style.display="block";
  }
}

/* ---------- QQ群号一键复制 ---------- */
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve,reject)=>{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); resolve(); }
    catch(e){ reject(e); }
    document.body.removeChild(ta);
  });
}
document.querySelectorAll('.qq-copy').forEach(btn=>{
  btn.addEventListener('click', async ()=>{
    const qq=btn.dataset.qq||'';
    const tip=btn.parentElement.querySelector('.qq-tip');
    try{
      await copyText(qq);
      btn.classList.add('copied');
      const old=btn.textContent;
      btn.textContent='已复制';
      if(tip) tip.textContent='群号已复制，快去加群吧';
      setTimeout(()=>{
        btn.classList.remove('copied');
        btn.textContent=old;
        if(tip) tip.textContent='点击复制群号';
      },1600);
    }catch(e){
      if(tip) tip.textContent='复制失败，请手动输入：'+qq;
    }
  });
});

// 启动：读取外部json
loadData();
